[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mv"
version = "0.1.0"
description = "Librería de visión propia, construida TP a TP en la materia xG SHA (versión didáctica)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.setuptools]
packages = ["mv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
